<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title">
  <title id="title">termite: a soldier termite, half red team, half blue team</title>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2420"/>
      <stop offset="1" stop-color="#161210"/>
    </linearGradient>
    <clipPath id="left"><rect x="-140" y="-140" width="140" height="280"/></clipPath>
    <clipPath id="right"><rect x="0" y="-140" width="140" height="280"/></clipPath>
    <!-- A soldier from above: big head, jaws, thorax, abdomen. -->
    <g id="soldier" stroke-linecap="round" stroke-linejoin="round">
      <g fill="none" stroke="currentColor">
        <path stroke-width="5" d="M-13 -86 C -26 -98, -44 -96, -54 -110"/>
        <path stroke-width="5" d="M13 -86 C 26 -98, 44 -96, 54 -110"/>
        <path stroke-width="8" d="M-9 -92 C -13 -110, -7 -122, 5 -128"/>
        <path stroke-width="8" d="M9 -92 C 13 -110, 7 -122, -5 -128"/>
        <g stroke-width="6.5">
          <path d="M-13 -24 L-42 -36 L-62 -58"/>
          <path d="M13 -24 L42 -36 L62 -58"/>
          <path d="M-15 -12 L-50 -10 L-74 2"/>
          <path d="M15 -12 L50 -10 L74 2"/>
          <path d="M-13 0 L-42 18 L-54 46"/>
          <path d="M13 0 L42 18 L54 46"/>
        </g>
      </g>
      <g fill="currentColor">
        <ellipse cx="0" cy="-62" rx="28" ry="33"/>
        <ellipse cx="0" cy="-16" rx="17" ry="17"/>
        <ellipse cx="0" cy="44" rx="31" ry="52"/>
      </g>
      <g fill="none" stroke="#161210" stroke-opacity="0.4" stroke-width="3.5">
        <path d="M-27 22 Q0 32 27 22"/>
        <path d="M-30 42 Q0 52 30 42"/>
        <path d="M-28 62 Q0 72 28 62"/>
        <path d="M-20 80 Q0 88 20 80"/>
      </g>
    </g>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="52" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="51.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>
  <g transform="translate(128 132) scale(0.86)">
    <use href="#soldier" xlink:href="#soldier" color="#ef4d4d" clip-path="url(#left)"/>
    <use href="#soldier" xlink:href="#soldier" color="#3f8cff" clip-path="url(#right)"/>
  </g>
</svg>
