# SonarQube analysis for termite. Run with scripts/sonar.sh, which also
# produces the reports named below.
sonar.projectKey=termite
sonar.projectName=termite
sonar.sourceEncoding=UTF-8
sonar.links.scm=https://github.com/tanepiper/termite

# Code and tests. Rust unit tests live next to the code (src/**/tests.rs),
# so src is listed under both and split by the inclusion patterns.
sonar.sources=src,bash/lib,bash/preamble.sh,bash/examples,shell,scripts,semgrep/termite-rust.yaml,semgrep/termite-bash.yaml,docs/tapes/record.sh,Cargo.toml,Cargo.lock
sonar.tests=src,tests,bash/tests
sonar.test.inclusions=**/tests.rs,**/tests/**
sonar.exclusions=**/tests.rs,**/tests/**,target/**,docs/assets/**

# Rust: Sonar runs Clippy itself; coverage comes from cargo-llvm-cov.
sonar.rust.lcov.reportPaths=target/sonar/lcov.info

# Findings from other tools (ShellCheck, Semgrep, cargo-audit), converted
# to Sonar's generic issue format.
sonar.externalIssuesReportPaths=target/sonar/shellcheck.json,target/sonar/semgrep.json,target/sonar/cargo-audit.json

# Fail the run when the quality gate fails.
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# tmite is a command-line program: printing to the terminal is its job, so
# rust:S106 ("use a logging framework") does not apply to the binary. It
# stays on for the library, which must never print.
sonar.issue.ignore.multicriteria=binprint
sonar.issue.ignore.multicriteria.binprint.ruleKey=rust:S106
sonar.issue.ignore.multicriteria.binprint.resourceKey=src/bin/**
