name: Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - site/**
      - eval/results/**
      - eval/observations/**
  pull_request:
    paths-ignore:
      - site/**
      - eval/results/**
      - eval/observations/**

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          echo "RUSTC=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-${{ env.RUSTC }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-${{ env.RUSTC }}-
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install Semgrep
        if: runner.os == 'Linux'
        run: pipx install semgrep==1.183.0
      - name: Test
        run: cargo test --locked
      - name: Test the bash library
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y --no-install-recommends bats
          bash/tests/run.sh
