name: Checks

on:
  push:
    branches: [main]
    paths-ignore:
      - site/**
      - eval/results/**
      - eval/observations/**
  pull_request:
    paths-ignore:
      - site/**
      - eval/results/**
      - eval/observations/**

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: 0
  CARGO_TERM_COLOR: always

jobs:
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add clippy rustfmt
          echo "RUST_VERSION=$(rustc --version | cut -d' ' -f2)" >> "$GITHUB_ENV"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-
      - name: Format
        if: runner.os == 'Linux'
        run: cargo fmt --check
      - name: Lint
        if: runner.os == 'Linux'
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Install Semgrep
        if: runner.os == 'Linux'
        run: pipx install semgrep==1.183.0
      # Scripts need bash 5.3, which only Homebrew has here. The Mac job runs those tests.
      - name: Install bash and the script tools
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install bash shellcheck bats-core
      - name: Test
        run: cargo test --locked
      - name: Test the release script
        if: runner.os == 'Linux'
        run: python3 -I scripts/test_release.py
      - name: Test the bash library
        if: runner.os == 'macOS'
        run: bash/tests/run.sh
