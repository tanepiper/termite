---
name: Docs site

on:
  push:
    branches: [main]
    paths:
      - site/**
      - docs/**
      - eval/observations/**
      - scripts/check-public.sh
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check nothing dangerous is in the public data
        run: |
          scripts/check-public.sh
          scripts/check-public.sh site/src/data/hosted.json
          cat eval/observations/*.jsonl > /tmp/observations.jsonl
          scripts/check-public.sh /tmp/observations.jsonl
      - name: Install without running package scripts
        run: npm ci --ignore-scripts
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
