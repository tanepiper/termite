---
name: Docs site

# The site goes out for two reasons: a release, which starts this workflow when it
# finishes, and new data pushed to main, which can arrive without a release. Run it by
# hand to send the data again. Either way the pages and docs come from the latest
# release, so docs for work that hasn't been released stay off the site.
on:
  push:
    branches: [main]
    paths:
      - eval/history.jsonl
      - eval/observations/**
      - site/src/data/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Use the latest release's pages with the newest data
        run: |
          tag=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null) || exit 0
          rm -rf site docs
          git checkout "$tag" -- site docs
          git checkout "$GITHUB_SHA" -- site/src/data site/public/releases.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - name: Check nothing dangerous is in the public data
        run: |
          scripts/check-public.sh
          cat eval/observations/*.jsonl > /tmp/observations.jsonl
          scripts/check-public.sh /tmp/observations.jsonl
          scripts/findings.py --check
      - name: Install without running package scripts
        run: npm ci --ignore-scripts
        working-directory: site
      - name: Build
        run: npm run build
        working-directory: site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
