name: Release

# Start this by hand when a version is ready, with Actions > Release > Run workflow, or
# `gh workflow run release.yml`. Nobody pushes a tag. The pipeline runs the checks, then
# turns the Unreleased changelog into this version and tags that commit. It builds from
# the tag, publishes the release, moves main to the next -dev version through a pull
# request, and sends out the site.
#
# With trial on, it stops after the builds: nothing is pushed, tagged or published.
# If a build fails after the tag is pushed, delete the tag, fix the fault and run it again.

on:
  workflow_dispatch:
    inputs:
      trial:
        description: Stop after the builds, and publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_STRIP: 'true'
  CARGO_TERM_COLOR: always

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  prepare:
    needs: checks
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Check this is main
        if: ${{ !inputs.trial }}
        run: test "$GITHUB_REF" = refs/heads/main
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      # Stop here if the token is missing or expired, before anything is tagged.
      - name: Check the pull request token
        if: ${{ !inputs.trial }}
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          test -n "$GH_TOKEN"
          gh api "repos/$GITHUB_REPOSITORY" --silent
      - name: Make the changelog and version for this release
        id: version
        run: echo "number=$(python3 -I scripts/release.py prepare "$(date -u +%F)")" >> "$GITHUB_OUTPUT"
      - name: Commit and tag the release
        id: tag
        env:
          NUMBER: ${{ steps.version.outputs.number }}
          TRIAL: ${{ inputs.trial }}
        run: |
          tag="v$NUMBER"
          if git rev-parse -q --verify "refs/tags/$tag"; then
            echo "$tag already exists" >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md Cargo.toml Cargo.lock
          git commit -m "Release $tag"
          git tag "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if [ "$TRIAL" = true ]; then
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            git push origin "refs/tags/$tag"
            echo "ref=refs/tags/$tag" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: prepare
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin, cross: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          persist-credentials: false
      - name: Check the tag matches the version
        if: ${{ !inputs.trial }}
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: test "${TAG#v}" = "$(python3 -I scripts/release.py version)"
      # Static, so it runs on any Linux. No caches in a release build.
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e CARGO_PROFILE_RELEASE_STRIP -e CARGO_INCREMENTAL \
            rust:1-alpine@sha256:44819b27be4c97b0e4d7203bd2e02c4820f97700211b6a37fb4c246a2de59383 \
            sh -c 'apk add --no-cache build-base cmake perl && cargo build --release --locked --bin tmite'
          sudo cp target/release/tmite tmite
      - name: Build on macOS
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          cargo build --release --locked --bin tmite --target "$TARGET"
          cp "target/$TARGET/release/tmite" tmite
      - name: Check the program runs
        if: ${{ !matrix.cross }}
        run: |
          ./tmite --version
          echo 'rm -rf /' | ./tmite check --json | grep -q '"rating":"risky"\|"rating":"dangerous"\|"level":[45]'
      - name: Pack
        env:
          NAME: ${{ matrix.name }}
        run: tar -czf "tmite-$NAME.tar.gz" tmite LICENSE README.md CHANGELOG.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmite-${{ matrix.name }}
          path: tmite-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    if: ${{ !inputs.trial }}
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
      pull-requests: read
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ needs.prepare.outputs.tag }}
      BUMP_BRANCH: release/${{ needs.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.ref }}
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: List the hashes
        working-directory: dist
        run: sha256sum tmite-*.tar.gz > SHA256SUMS
      - name: Write the release record
        run: python3 -I scripts/release.py record "$(git rev-parse HEAD)" "$(date -u +%F)" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tmite-*.tar.gz
            site/public/releases.json
      - name: Publish the GitHub release
        run: |
          python3 -I scripts/release.py notes > notes.md
          gh release create "$TAG" dist/tmite-*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "termite ${TAG#v}" --notes-file notes.md
          rm notes.md
      # main only takes pull requests. A pull request opened with the job's own token
      # starts no checks, and checks started by hand don't count towards the ruleset,
      # so this step uses RELEASE_PR_TOKEN.
      - name: Open the pull request that moves main to the next version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PR_TOKEN }}
        run: |
          next=$(python3 -I scripts/release.py bump)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md Cargo.toml Cargo.lock site/public/releases.json
          git commit -m "Record $TAG and start $next"
          # A merge, not a rebase: the tagged commit must stay in main's history.
          git fetch origin main
          git merge --no-edit FETCH_HEAD
          git push origin "HEAD:refs/heads/$BUMP_BRANCH"
          gh pr create --base main --head "$BUMP_BRANCH" \
            --title "Record $TAG and start $next" \
            --body "Made by the release workflow for $TAG. It merges when the checks pass."
          gh pr merge "$BUMP_BRANCH" --auto --merge
      # The site reads releases.json from main, so it waits for the merge. If this
      # times out, merge the pull request, then run pages.yml by hand.
      - name: Wait for the pull request to merge
        timeout-minutes: 60
        run: |
          until [ "$(gh pr view "$BUMP_BRANCH" --json state --jq .state)" = MERGED ]; do
            sleep 30
          done
          git push origin --delete "$BUMP_BRANCH"
      # A change to releases.json alone doesn't start the site, so ask for it.
      - name: Publish the site
        run: gh workflow run pages.yml --ref main
