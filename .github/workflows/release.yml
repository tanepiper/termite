name: Release

# A tag such as v0.1.0 builds, signs and publishes a release, then moves main to
# the next version through a pull request. Run by hand, it only builds, to test
# the pipeline.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_RELEASE_STRIP: 'true'
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { name: linux-x86_64, runner: ubuntu-24.04 }
          - { name: linux-arm64, runner: ubuntu-24.04-arm }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: macos-x86_64, runner: macos-latest, target: x86_64-apple-darwin, cross: true }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "${GITHUB_REF_NAME#v}" = "$(python3 -I scripts/release.py version)"
      # Static, so it runs on any Linux. No caches in a release build.
      - name: Build on Linux
        if: runner.os == 'Linux'
        run: |
          docker run --rm -v "$PWD:/work" -w /work \
            -e CARGO_PROFILE_RELEASE_STRIP -e CARGO_INCREMENTAL \
            rust:1-alpine@sha256:44819b27be4c97b0e4d7203bd2e02c4820f97700211b6a37fb4c246a2de59383 \
            sh -c 'apk add --no-cache build-base cmake perl && cargo build --release --locked --bin tmite'
          sudo cp target/release/tmite tmite
      - name: Build on macOS
        if: runner.os == 'macOS'
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add "$TARGET"
          cargo build --release --locked --bin tmite --target "$TARGET"
          cp "target/$TARGET/release/tmite" tmite
      - name: Check the program runs
        if: ${{ !matrix.cross }}
        run: |
          ./tmite --version
          echo 'rm -rf /' | ./tmite check --json | grep -q '"rating":"risky"\|"rating":"dangerous"\|"level":[45]'
      - name: Pack
        env:
          NAME: ${{ matrix.name }}
        run: tar -czf "tmite-$NAME.tar.gz" tmite LICENSE README.md CHANGELOG.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tmite-${{ matrix.name }}
          path: tmite-${{ matrix.name }}.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      attestations: write
      contents: write
      id-token: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      BUMP_BRANCH: release/${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - name: List the hashes
        working-directory: dist
        run: sha256sum tmite-*.tar.gz > SHA256SUMS
      - name: Write the release record
        run: python3 -I scripts/release.py record "$GITHUB_SHA" "$(date -u +%F)" dist
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/tmite-*.tar.gz
            site/public/releases.json
      - name: Publish the GitHub release
        run: |
          python3 -I scripts/release.py notes > notes.md
          gh release create "$GITHUB_REF_NAME" dist/tmite-*.tar.gz dist/SHA256SUMS \
            --verify-tag --title "termite ${GITHUB_REF_NAME#v}" --notes-file notes.md
          rm notes.md
      # main only takes pull requests. A pull request opened with this token starts
      # no workflows, so ask for the checks. They attach to the commit, which is
      # what the ruleset reads.
      - name: Open the pull request that moves main to the next version
        run: |
          next=$(python3 -I scripts/release.py bump "$(date -u +%F)")
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md Cargo.toml Cargo.lock site/public/releases.json
          git commit -m "Record $GITHUB_REF_NAME and start $next"
          git pull --rebase origin main
          git push origin "HEAD:refs/heads/$BUMP_BRANCH"
          gh pr create --base main --head "$BUMP_BRANCH" \
            --title "Record $GITHUB_REF_NAME and start $next" \
            --body "Made by the release workflow for $GITHUB_REF_NAME. It merges when the checks pass."
          gh workflow run ci.yml --ref "$BUMP_BRANCH"
          gh pr merge "$BUMP_BRANCH" --auto --merge
      # The site reads releases.json from main, so it waits for the merge. If this
      # times out, merge the pull request, then run pages.yml by hand.
      - name: Wait for the pull request to merge
        timeout-minutes: 60
        run: |
          until [ "$(gh pr view "$BUMP_BRANCH" --json state --jq .state)" = MERGED ]; do
            sleep 30
          done
          git push origin --delete "$BUMP_BRANCH"
      # A merge from this workflow starts no other workflow, so ask for the site.
      - name: Publish the site
        run: gh workflow run pages.yml --ref main
