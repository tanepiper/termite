[package]
name = "termite"
description = "Turns plain requests into checked shell commands with a local model"
version = "0.2.0-dev"
edition = "2024"
rust-version = "1.87"
license = "Apache-2.0"

[dependencies]
hmac = "0.13.0"
libc = "0.2.191"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.0"
shell-words = "1.1.0"
thiserror = "2.0.18"
tokio = { version = "1.54.1", features = ["rt", "time"] }

[dev-dependencies]
mockall = "0.15.0"

# The model evaluation: `scripts/analyse.sh` runs it. Never shipped.
[[example]]
name = "eval"
path = "examples/eval/main.rs"
test = true
